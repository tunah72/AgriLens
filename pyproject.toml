[project]
name = "ml-vietnam-plant-disease-detection"
version = "0.1.0"
description = "Rice and coffee leaf disease instance segmentation and diagnosis system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "asyncio>=4.0.0",
    "crawl4ai>=0.8.6",
    "ddgs>=9.13.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "huggingface-hub>=1.9.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "minio>=7.2.0",
    "mlflow>=2.16.0",
    "numpy>=2.0.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.19.0",
    "openai>=2.30.0",
    "opencv-python>=4.13.0.92",
    "pandas>=2.2.0",
    "pillow>=12.2.0",
    "psycopg2-binary>=2.9.9",
    "pycocotools>=2.0.11",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.2",
    "ray[tune]>=2.37.0",
    "redis>=5.0.0",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.22",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "streamlit>=1.56.0",
    "timm>=1.0.0",
    "torch>=2.11.0",
    "torchmetrics>=1.5.0",
    "torchvision>=0.26.0",
    "tqdm>=4.66.0",
    "transformers>=4.45.0",
    "ultralytics>=8.4.51",
    "uvicorn[standard]>=0.30.0",
    "x-anylabeling-cvhub[cpu]>=4.0.0b3",
]

[dependency-groups]
backend = [
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "minio>=7.2.0",
    "numpy>=2.0.0",
    "onnxruntime>=1.19.0",
    "opencv-python>=4.13.0.92",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=12.2.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.30.0",
]
dev = [
    "locust>=2.45.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
asyncio_mode = "auto"
